name: Keepalive

# GitHub disables scheduled workflows after 60 days with no repository activity.
# This pushes a trivial empty commit monthly so the Morning DM cron never gets
# auto-disabled. Runs on the 1st of each month; can also be triggered manually.

on:
  schedule:
    - cron: '17 3 1 * *'   # 03:17 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump repository activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (keep scheduled workflows enabled)"
          git push
